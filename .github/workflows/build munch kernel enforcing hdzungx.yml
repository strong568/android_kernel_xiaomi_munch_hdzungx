name: Build Munch Perf Kernel (Non-KSU / KSU + SuSFS 4.19 + SELinux Enforcing)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      ksu_flavor:
        description: 'Chọn nhánh KernelSU (Chọn "None" nếu build Non-KSU sạch)'
        required: true
        type: choice
        options:
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'backslashxx-KernelSU'
          - 'ReSukiSU'
          - 'KowSU'
          - 'None'
        default: 'KernelSU-Next'
      enable_susfs:
        description: 'Bật cấu hình SuSFS (Ẩn Root VNeID, Ngân hàng - Chỉ áp dụng khi có KSU)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel munch (perf)
    runs-on: ubuntu-22.04

    steps:
      - name: Dọn dẹp đĩa & Cài đặt gói biên dịch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git libssl-dev libelf-dev \
            libncurses5-dev lzop python3 zip cpio liblz4-tool libtinfo5 libncurses5 \
            gcc-multilib g++-multilib lld llvm zstd libfdt-dev patch

      - name: Tải AOSP Clang Toolchain (r450784d)
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          curl -LSs "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/heads/main/clang-r450784d.tar.gz" | tar -xz -C $GITHUB_WORKSPACE/clang

      - name: Checkout mã nguồn Kernel munch (Nhánh perf)
        uses: actions/checkout@v4
        with:
          repository: munch-devs/android_kernel_xiaomi_munch
          ref: perf
          path: kernel

      - name: Tải tài nguyên SuSFS (Nhánh kernel-4.19 cho SM8250)
        if: ${{ inputs.ksu_flavor != 'None' && inputs.enable_susfs }}
        run: |
          git clone --depth=1 https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs4ksu
          cp -r susfs4ksu/kernel_patches/fs kernel/
          cp -r susfs4ksu/kernel_patches/include/linux/susfs.h kernel/include/linux/
          echo "SUSFS_PATCH_DIR=$GITHUB_WORKSPACE/susfs4ksu/kernel_patches" >> $GITHUB_ENV

      - name: Tích hợp KernelSU và Áp dụng SuSFS Patch
        if: ${{ inputs.ksu_flavor != 'None' }}
        run: |
          cd kernel
          FLAVOR="${{ inputs.ksu_flavor }}"
          
          case "$FLAVOR" in
            "SukiSU-Ultra")
              echo "==> Thiết lập SukiSU-Ultra..."
              curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s main
              ;;
            "backslashxx-KernelSU")
              echo "==> Thiết lập backslashxx-KernelSU..."
              curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
              ;;
            "ReSukiSU")
              echo "==> Thiết lập ReSukiSU (BakaSU)..."
              curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -
              ;;
            "KowSU")
              echo "==> Thiết lập KowSU..."
              curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -
              ;;
            "KernelSU-Next")
              echo "==> Thiết lập KernelSU-Next..."
              curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
              ;;
          esac

          if [ "${{ inputs.enable_susfs }}" = "true" ]; then
            echo "==> Áp dụng Patch SuSFS cho Kernel 4.19..."
            KSU_DIR="KernelSU"
            [ ! -d "$KSU_DIR" ] && [ -d "drivers/kernelsu" ] && KSU_DIR="drivers/kernelsu"
            
            if [ -d "$KSU_DIR" ]; then
              cd "$KSU_DIR"
              patch -p1 --forward < $SUSFS_PATCH_DIR/KernelSU/10_enable_susfs_for_ksu.patch || true
              cd ..
            fi
            
            patch -p1 --forward < $SUSFS_PATCH_DIR/fs_susfs.patch || true
          fi

      - name: Biên dịch Kernel munch
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          export LLVM_IAS=1
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-

          DEFCONFIG="munch_defconfig"
          [ ! -f "arch/arm64/configs/$DEFCONFIG" ] && DEFCONFIG="vendor/munch_user_defconfig"
          [ ! -f "arch/arm64/configs/$DEFCONFIG" ] && DEFCONFIG="vendor/munch_defconfig"

          mkdir -p out
          make O=out $DEFCONFIG

          # ==============================================================
          # ÉP CỨNG CHẾ ĐỘ SELINUX ENFORCING CHUẨN TRONG KERNEL
          # ==============================================================
          echo "==> Thiết lập SELinux Enforcing..."
          ./scripts/config --file out/.config --enable CONFIG_SECURITY_SELINUX
          ./scripts/config --file out/.config --enable CONFIG_SECURITY_SELINUX_BOOTPARAM
          ./scripts/config --file out/.config --set-val CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE 1
          ./scripts/config --file out/.config --disable CONFIG_SECURITY_SELINUX_DEVELOP
          ./scripts/config --file out/.config --enable CONFIG_ALWAYS_ENFORCE

          # Cấu hình cờ KernelSU và toàn bộ cờ ẩn SuSFS
          if [ "${{ inputs.ksu_flavor }}" != "None" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KSU
            if [ "${{ inputs.enable_susfs }}" = "true" ]; then
              echo "==> Bật toàn bộ các cờ bảo vệ ẩn Root & SELinux của SuSFS..."
              for cfg in \
                CONFIG_KSU_SUSFS \
                CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
                CONFIG_KSU_SUSFS_SUS_PATH \
                CONFIG_KSU_SUSFS_SUS_MOUNT \
                CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSURULES \
                CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
                CONFIG_KSU_SUSFS_SUS_KSTAT \
                CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
                CONFIG_KSU_SUSFS_TRY_UMOUNT \
                CONFIG_KSU_SUSFS_SPOOF_UNAME \
                CONFIG_KSU_SUSFS_ENABLE_LOG \
                CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                CONFIG_KSU_SUSFS_OPEN_REDIRECT \
                CONFIG_KSU_SUSFS_SPOOF_SELINUX; do
                ./scripts/config --file out/.config --enable "$cfg" \vert{}\vert{} echo "${cfg}=y" >> out/.config
              done
            fi
          else
            ./scripts/config --file out/.config --disable CONFIG_KSU
          fi

          make O=out olddefconfig
          make O=out -j$(nproc --all)

      - name: Thiết lập AnyKernel3 (Chuẩn Munch & Không can thiệp SELinux)
        run: |
          git clone --depth=1 https://github.com/kvsnr113/AnyKernel3.git AnyKernel3[span_0](start_span)[span_0](end_span)
          cd AnyKernel3

          # 1. Khóa cứng thiết bị là munch
          sed -i 's/devicename=.*/devicename=munch/g' anykernel.sh
          sed -i 's/devicename=pipa/devicename=munch/g' anykernel.sh

          # 2. Xóa sạch dấu tích pipa
          sed -i 's/dtbo_oem_pipa/dtbo_oem/g' anykernel.sh
          sed -i 's/dtbo_def_pipa/dtbo_def/g' anykernel.sh

          # 3. Viết lại hàm cấu hình chuyên biệt Munch
          python3 -c '
          with open("anykernel.sh", "r") as f:
              code = f.read()

          new_configure_auto = """configure_auto() {
    sleep 0.5
    ui_print "--> [Munch] Scanning ROM type..."
    local IS_MIUI=0
    local prop_files="/system/build.prop /system_root/system/build.prop /system_root/build.prop /vendor/build.prop /product/etc/build.prop /product/build.prop /system_ext/etc/build.prop"
    for file in $prop_files; do
      if [ -f "$file" ]; then
        if grep -qE "ro.miui.ui.version|ro.mi.os.version|ro.vendor.miui.build.region|ro.miui.build.region" "$file" 2>/dev/null; then
          IS_MIUI=1
          break
        fi
      fi
    done

    if [ "$IS_MIUI" -eq 0 ]; then
      local r1=$(getprop ro.miui.ui.version.name 2>/dev/null)
      local r2=$(getprop ro.mi.os.version.name 2>/dev/null)
      local r3=$(getprop ro.vendor.miui.build.region 2>/dev/null)
      if [ -n "$r1" ] || [ -n "$r2" ] \vert{}\vert{} [ -n "$r3" ]; then
        IS_MIUI=1
      fi
    fi

    if [ "$IS_MIUI" -eq 1 ]; then
      ui_print "--> Detected: MIUI / HyperOS ROM"
      rom="rom_oem"
      dtbo="dtbo_oem"
    else
      ui_print "--> Detected: AOSP / Custom ROM"
      rom="rom_aosp"
      dtbo="dtbo_def"
    fi

    dtb="dtb_def"
    batt="batt_def"
    ui_print "--> Munch configuration finished!"
  }"""

          new_configure_manual = """configure_manual() {
    select_option "ROM / DTBO Type" "AOSP / CLO" "MIUI / HyperOS"
    case "$SELECT_RESULT" in
      *AOSP*|*CLO*)
        rom="rom_aosp"
        dtbo="dtbo_def"
        ;;
      *MIUI*|*HyperOS*)
        rom="rom_oem"
        dtbo="dtbo_oem"
        ;;
    esac
    dtb="dtb_def"
    batt="batt_def"
    ui_print " Manual configuration done!"
  }"""

          import re
          code = re.sub(r"configure_manual\(\)\s*\{[\s\S]*?ui_print\s*\" Manual configuration done !\"[\s\S]*?\}", new_configure_manual, code)
          code = re.sub(r"configure_auto\(\)\s*\{[\s\S]*?ui_print\s*\"\s*\" \" Auto configuration done !\"[\s\S]*?\}", new_configure_auto, code)

          with open("anykernel.sh", "w") as f:
              f.write(code)
          '
          cd ..

      - name: Đóng gói Kernel ZIP (Chuẩn MUNCH-*)
        run: |
          TARGET="MUNCH[span_1](start_span)"[span_1](end_span)

          if [ -f "kernel/out/arch/arm64/boot/Image" ]; then
            cp kernel/out/arch/arm64/boot/Image "AnyKernel3/${TARGET}-Image[span_2](start_span)"[span_2](end_span)
          elif [ -f "kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel/out/arch/arm64/boot/Image.gz "AnyKernel3/${TARGET}-Image"
          fi

          [ -f "kernel/out/arch/arm64/boot/dtb" ] && cp kernel/out/arch/arm64/boot/dtb "AnyKernel3/${TARGET}-dtb"
          [ -f "kernel/out/arch/arm64/boot/dtbo.img" ] && cp kernel/out/arch/arm64/boot/dtbo.img "AnyKernel3/${TARGET}-dtbo.img"

          KSU_LABEL="${{ inputs.ksu_flavor == 'None' && 'NonKSU' || inputs.ksu_flavor }}"
          SAFE_LABEL=$(echo "$KSU_LABEL" | tr -d ' ()' | tr '/' '-')

          ZIP_NAME="Munch-Perf-${SAFE_LABEL}"
          if [ "${{ inputs.ksu_flavor }}" != "None" ] && [ "${{ inputs.enable_susfs }}" = "true" ]; then
            ZIP_NAME="${ZIP_NAME}-SuSFS"
          fi
          ZIP_NAME="${ZIP_NAME}-$(date +%y%m%d-%H%M).zip"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" META-INF tools ${TARGET}-* anykernel.sh -x "*.git*"
          cd ..

          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV
          echo "TAG_NAME=perf-build-$(date +'\%Y\%m\%d-\%H\%M\%S')" >> $GITHUB_ENV

      - name: Lưu trữ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_PATH }}
          path: ${{ env.ZIP_PATH }}

      - name: Phát hành GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Kernel Munch Perf [${{ inputs.ksu_flavor == 'None' && 'Non-KSU' || inputs.ksu_flavor }}]"
          body: |
            ### 📌 Thông tin bản build Kernel POCO F4 (munch - perf)
            - **Nhánh Kernel:** `perf`
            - **Biến thể Root:** `${{ inputs.ksu_flavor == 'None' && 'Non-KSU (Stock / Clean Base)' || inputs.ksu_flavor }}`
            - **SuSFS Support:** `${{ (inputs.ksu_flavor != 'None' && inputs.enable_susfs) && 'Enabled (Full Flags - Linux 4.19)' || 'Disabled' }}`
            - **SELinux:** Enforcing Hardened (`CONFIG_SECURITY_SELINUX=y`, `CONFIG_ALWAYS_ENFORCE=y`)
            - **AnyKernel3:** Tự động phát hiện môi trường AOSP / HyperOS qua build.prop
            - **Tên tệp:** `${{ env.ZIP_PATH }}`
          files: |
            ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
