name: Build Munch Perf Kernel (Non-KSU / KSU + SuSFS 4.19 + SELinux Enforcing)

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      ksu_flavor:
        description: 'Chọn nhánh KernelSU (Chọn "None" nếu build Non-KSU sạch)'
        required: true
        type: choice
        options:
          - 'ReSukiSU'
          - 'KernelSU-Next'
          - 'SukiSU-Ultra'
          - 'backslashxx-KernelSU'
          - 'KowSU'
          - 'None'
        default: 'ReSukiSU'
      enable_susfs:
        description: 'Bật cấu hình SuSFS (Ẩn Root VNeID, Ngân hàng - Chỉ áp dụng khi có KSU)'
        required: true
        type: boolean
        default: true

jobs:
  build:
    name: Build Kernel munch (perf)
    runs-on: ubuntu-22.04

    steps:
      - name: Dọn dẹp đĩa & Cài đặt gói biên dịch
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex git libssl-dev libelf-dev \
            libncurses5-dev lzop python3 zip cpio liblz4-tool libtinfo5 libncurses5 \
            lld llvm zstd libfdt-dev patch gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Tải ZyC-Clang 14.0.6
        run: |
          mkdir -p $GITHUB_WORKSPACE/clang
          curl -fLSs --retry 5 "https://github.com/ZyCromerZ/Clang/releases/download/14.0.6-20250105-release/Clang-14.0.6-20250105.tar.gz" -o clang.tar.gz
          tar -xzf clang.tar.gz -C $GITHUB_WORKSPACE/clang
          rm -f clang.tar.gz

      - name: Checkout mã nguồn Kernel munch (Nhánh perf)
        uses: actions/checkout@v4
        with:
          repository: munch-devs/android_kernel_xiaomi_munch
          ref: perf
          path: kernel
          fetch-depth: 1

      - name: Tải tài nguyên SuSFS (Mirror GitHub & GitLab)
        if: ${{ inputs.ksu_flavor != 'None' && inputs.enable_susfs }}
        run: |
          echo "==> Đang tải susfs4ksu (nhánh kernel-4.19)..."
          rm -rf susfs4ksu

          if git clone --depth=1 --single-branch https://github.com/xazkindodev-boop/lavender-ng-mirror.git -b kernel-4.19 susfs4ksu; then
            echo "==> Tải thành công từ GitHub Mirror (lavender-ng-mirror)!"
          elif git clone --depth=1 --single-branch https://gitlab.com/simonpunk/susfs4ksu.git -b kernel-4.19 susfs4ksu; then
            echo "==> Tải thành công từ GitLab gốc!"
          else
            echo "==> Chuyển sang tải qua gói nén Archive..."
            mkdir -p susfs4ksu
            curl -fLSs --retry 5 "https://github.com/xazkindodev-boop/lavender-ng-mirror/archive/refs/heads/kernel-4.19.tar.gz" -o susfs.tar.gz || \
            curl -fLSs --retry 5 "https://gitlab.com/simonpunk/susfs4ksu/-/archive/kernel-4.19/susfs4ksu-kernel-4.19.tar.gz" -o susfs.tar.gz
            tar -xzf susfs.tar.gz --strip-components=1 -C susfs4ksu
            rm -f susfs.tar.gz
          fi

          if [ -d "susfs4ksu/kernel_patches" ]; then
            PATCH_BASE="susfs4ksu/kernel_patches"
          elif [ -d "susfs4ksu/susfs4ksu/kernel_patches" ]; then
            PATCH_BASE="susfs4ksu/susfs4ksu/kernel_patches"
          else
            echo "LỖI: Không tìm thấy thư mục kernel_patches trong repo!"
            exit 1
          fi

          cp -r "$PATCH_BASE/fs/"* kernel/fs/
          cp -r "$PATCH_BASE/include/linux/"* kernel/include/linux/
          echo "SUSFS_PATCH_DIR=$GITHUB_WORKSPACE/$PATCH_BASE" >> $GITHUB_ENV

      - name: Tích hợp KernelSU và Áp dụng SuSFS Patch
        run: |
          cd kernel
          FLAVOR="${{ inputs.ksu_flavor }}"
          
          if [ "$FLAVOR" != "None" ]; then
            case "$FLAVOR" in
              "SukiSU-Ultra")
                echo "==> Thiết lập SukiSU-Ultra..."
                curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/refs/heads/main/kernel/setup.sh" | bash -s main
                ;;
              "backslashxx-KernelSU")
                echo "==> Thiết lập backslashxx-KernelSU..."
                curl -LSs "https://raw.githubusercontent.com/backslashxx/KernelSU/refs/heads/master/kernel/setup.sh" | bash -s master
                ;;
              "ReSukiSU")
                echo "==> Thiết lập ReSukiSU (BakaSU)..."
                curl -LSs "https://raw.githubusercontent.com/Baka-SU/BakaSU/main/kernel/setup.sh" | bash -
                ;;
              "KowSU")
                echo "==> Thiết lập KowSU..."
                curl -LSs "https://raw.githubusercontent.com/KOWX712/KernelSU/main/kernel/setup.sh" | bash -
                ;;
              "KernelSU-Next")
                echo "==> Thiết lập KernelSU-Next..."
                curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next
                ;;
            esac

            # Đồng bộ symlink giữa KernelSU và drivers/kernelsu
            if [ -d "KernelSU" ] && [ ! -e "drivers/kernelsu" ]; then
              ln -sfn ../KernelSU drivers/kernelsu
            elif [ -d "drivers/kernelsu" ] && [ ! -e "KernelSU" ]; then
              ln -sfn drivers/kernelsu KernelSU
            fi

            if [ -d "drivers/kernelsu" ] && [ ! -e "drivers/kernelsu/ksu" ]; then
              ln -sfn . drivers/kernelsu/ksu
            fi

            # Áp dụng Patch SuSFS nếu bật
            if [ "${{ inputs.enable_susfs }}" = "true" ]; then
              echo "==> Áp dụng Patch SuSFS cho Kernel 4.19..."
              KSU_DIR="KernelSU"
              [ ! -d "$KSU_DIR" ] && [ -d "drivers/kernelsu" ] && KSU_DIR="drivers/kernelsu"
              
              KSU_KCONFIG="drivers/kernelsu/Kconfig"
              [ ! -f "$KSU_KCONFIG" ] && [ -f "KernelSU/kernel/Kconfig" ] && KSU_KCONFIG="KernelSU/kernel/Kconfig"

              if [ -d "$KSU_DIR" ]; then
                # Kiểm tra nếu nhánh KSU đã tích hợp sẵn SuSFS (như ReSukiSU / SukiSU-Ultra) thì không patch đè lên KSU nữa
                if [ -f "$KSU_KCONFIG" ] && grep -qE 'config[[:space:]]+KSU_SUSFS' "$KSU_KCONFIG"; then
                  echo "==> [$FLAVOR] Đã hỗ trợ sẵn CONFIG_KSU_SUSFS trong mã nguồn! Bỏ qua patch KSU để tránh lỗi xung đột."
                else
                  cd "$KSU_DIR"
                  # 1. Áp dụng patch SuSFS gốc cho KSU
                  for ksu_patch in $SUSFS_PATCH_DIR/KernelSU/*.patch; do
                    [ -f "$ksu_patch" ] && patch -p1 --forward --fuzz=3 < "$ksu_patch" || true
                  done

                  # 2. Nếu là KernelSU-Next, tải thêm susfs_fix_patches từ WildKernels để tránh lỗi reject
                  if [ "$FLAVOR" = "KernelSU-Next" ]; then
                    echo "==> Tải thêm bản vá tương thích SuSFS cho KernelSU-Next từ WildKernels..."
                    git clone --depth=1 https://github.com/WildKernels/kernel_patches.git /tmp/wild_patches
                    
                    # Tự động dò phiên bản SuSFS hiện tại trong susfs_def.h (ví dụ: v1.5.12, v2.0.0...)
                    SUSFS_VER=$(grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' "$GITHUB_WORKSPACE/kernel/include/linux/susfs_def.h" | head -n1)
                    echo "Phiên bản SuSFS phát hiện: ${SUSFS_VER:-Không rõ}"

                    if [ -n "$SUSFS_VER" ] && [ -d "/tmp/wild_patches/next/susfs_fix_patches/$SUSFS_VER" ]; then
                      for fix_patch in /tmp/wild_patches/next/susfs_fix_patches/$SUSFS_VER/*.patch; do
                        [ -f "$fix_patch" ] && patch -p1 --forward --fuzz=3 < "$fix_patch" || true
                      done
                    fi
                    rm -rf /tmp/wild_patches
                  fi
                  cd "$GITHUB_WORKSPACE/kernel"
                fi
              fi
              
              # 3. Patch hệ thống file Kernel 4.19
              for k_patch in $SUSFS_PATCH_DIR/*.patch; do
                if [ -f "$k_patch" ]; then
                  echo "Đang patch kernel: $k_patch"
                  patch -p1 --forward --fuzz=3 < "$k_patch" || true
                fi
              done
            fi

          else
            echo "==> Chế độ Non-KSU: Tạo dummy drivers/kernelsu/Kconfig & Makefile..."
            mkdir -p drivers/kernelsu/ksu
            echo '# Dummy Kconfig' > drivers/kernelsu/Kconfig
            echo 'obj-$(CONFIG_KSU) += ksu/' > drivers/kernelsu/Makefile
            echo '# Dummy ksu Makefile' > drivers/kernelsu/ksu/Makefile
          fi

          if [ ! -f "drivers/kernelsu/ksu/Makefile" ] && [ ! -L "drivers/kernelsu/ksu" ]; then
            ln -sfn . drivers/kernelsu/ksu 2>/dev/null || (mkdir -p drivers/kernelsu/ksu && touch drivers/kernelsu/ksu/Makefile)
          fi

      - name: Biên dịch Kernel munch
        run: |
          cd kernel
          export PATH="$GITHUB_WORKSPACE/clang/bin:$PATH"

          MAKE_ARGS="
            ARCH=arm64 \
            SUBARCH=arm64 \
            CC=clang \
            LD=ld.lld \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            LLVM=1 \
            LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          "

          DEFCONFIG="munch_defconfig"
          [ ! -f "arch/arm64/configs/$DEFCONFIG" ] && DEFCONFIG="vendor/munch_user_defconfig"
          [ ! -f "arch/arm64/configs/$DEFCONFIG" ] && DEFCONFIG="vendor/munch_defconfig"

          mkdir -p out
          # Đã sửa lỗi dính biến $MAKE_ARGS và $DEFCONFIG
          make O=out $MAKE_ARGS "$DEFCONFIG"

          # Ép cứng SELinux Enforcing chuẩn
          echo "==> Thiết lập SELinux Enforcing..."
          ./scripts/config --file out/.config --enable CONFIG_SECURITY_SELINUX
          ./scripts/config --file out/.config --enable CONFIG_SECURITY_SELINUX_BOOTPARAM
          ./scripts/config --file out/.config --set-val CONFIG_SECURITY_SELINUX_BOOTPARAM_VALUE 1
          ./scripts/config --file out/.config --disable CONFIG_SECURITY_SELINUX_DEVELOP
          ./scripts/config --file out/.config --enable CONFIG_ALWAYS_ENFORCE

          # Cấu hình KernelSU và toàn bộ cờ ẩn SuSFS
          if [ "${{ inputs.ksu_flavor }}" != "None" ]; then
            ./scripts/config --file out/.config --enable CONFIG_KSU
            ./scripts/config --file out/.config --enable CONFIG_KPROBES
            ./scripts/config --file out/.config --enable CONFIG_HAVE_KPROBES
            ./scripts/config --file out/.config --enable CONFIG_KPROBE_EVENTS
            if [ "${{ inputs.enable_susfs }}" = "true" ]; then
              echo "==> Bật toàn bộ các cờ bảo vệ ẩn Root & SELinux của SuSFS..."
              for cfg in \
                CONFIG_KSU_SUSFS \
                CONFIG_KSU_SUSFS_HAS_MAGIC_MOUNT \
                CONFIG_KSU_SUSFS_SUS_PATH \
                CONFIG_KSU_SUSFS_SUS_MOUNT \
                CONFIG_KSU_SUSFS_AUTO_ADD_SUS_KSU_DEFAULT_MOUNT \
                CONFIG_KSU_SUSFS_AUTO_ADD_SUS_BIND_MOUNT \
                CONFIG_KSU_SUSFS_SUS_KSTAT \
                CONFIG_KSU_SUSFS_SUS_OVERLAYFS \
                CONFIG_KSU_SUSFS_TRY_UMOUNT \
                CONFIG_KSU_SUSFS_AUTO_ADD_TRY_UMOUNT_FOR_BIND_MOUNT \
                CONFIG_KSU_SUSFS_SPOOF_UNAME \
                CONFIG_KSU_SUSFS_ENABLE_LOG \
                CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS \
                CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG \
                CONFIG_KSU_SUSFS_OPEN_REDIRECT \
                CONFIG_KSU_SUSFS_SPOOF_SELINUX \
                CONFIG_KSU_SUSFS_SUS_SU; do
                ./scripts/config --file out/.config --enable "$cfg" || echo "${cfg}=y" >> out/.config
              done
            fi
          else
            ./scripts/config --file out/.config --disable CONFIG_KSU
          fi

          make O=out $MAKE_ARGS olddefconfig
          make O=out $MAKE_ARGS -j$(nproc --all)

          # Tự động nối các file .dtb rời thành 1 file dtb duy nhất cho Munch (sm8250)
          if [ ! -f "out/arch/arm64/boot/dtb" ]; then
            find out/arch/arm64/boot/dts -name '*.dtb' -exec cat {} + > out/arch/arm64/boot/dtb 2>/dev/null || true
          fi

      - name: Thiết lập AnyKernel3 (Chuẩn Munch & Sạch Pipa)
        run: |
          git clone --depth=1 https://github.com/kvsnr113/AnyKernel3.git AnyKernel3
          cd AnyKernel3

          cat << 'EOF' > anykernel.sh
          # AnyKernel3 Ramdisk Mod Script
          # Munch (POCO F4) Dedicated Installer

          properties() { '
          kernel.string=\\ Munch Perf Kernel \\
          do.modules=0
          do.systemless=1
          '; }

          devicecheck() {
            local device devicename match product testname vendordevice vendorproduct;
            device=$(getprop ro.product.device 2>/dev/null);
            product=$(getprop ro.build.product 2>/dev/null);
            vendordevice=$(getprop ro.product.vendor.device 2>/dev/null);
            vendorproduct=$(getprop ro.vendor.product.device 2>/dev/null);
            for testname in munch munchin; do
              for devicename in $device$product $vendordevice$vendorproduct; do
                if [ "$devicename" = "$testname" ]; then
                  match=1
                  break 2
                fi
              done
            done
            if [ -z "$match" ]; then
              abort " " "Thiet bi khong ho tro (Chi ho tro Munch/POCO F4). Dang huy...";
            fi
          }

          select_option() {
            ui_print " - $1 :"
            ui_print "  (Vol +) $2"
            ui_print "  (Vol -) $3"
            SELECT_RESULT=""
            while true; do
              key_event=$(getevent -qlc 1)
              case "$key_event" in
                *"KEY_VOLUMEUP"*"DOWN"*|*"KEY_VOLUMEUP"*"1"*)
                  ui_print "  Selected : $2" " "
                  SELECT_RESULT="$2"
                  break
                  ;;
                *"KEY_VOLUMEDOWN"*"DOWN"*|*"KEY_VOLUMEDOWN"*"1"*)
                  ui_print "  Selected : $3" " "
                  SELECT_RESULT="$3"
                  break
                  ;;
              esac
              sleep 0.1
            done
          }

          configure_manual() {
            select_option "ROM / DTBO Type" "AOSP / CLO" "MIUI / HyperOS"
            case "$SELECT_RESULT" in
              *AOSP*|*CLO*)
                rom="rom_aosp"
                dtbo="dtbo_def"
                ;;
              *MIUI*|*HyperOS*)
                rom="rom_oem"
                dtbo="dtbo_oem"
                ;;
            esac
            dtb="dtb_def"
            batt="batt_def"
            ui_print " Cau hinh thu cong hoan tat!"
          }

          configure_auto() {
            sleep 0.5
            ui_print "--> [Munch] Kiem tra loai ROM..."
            local IS_MIUI=0
            local prop_files="/system/build.prop /system_root/system/build.prop /system_root/build.prop /vendor/build.prop /product/etc/build.prop /product/build.prop /system_ext/etc/build.prop"
            for file in $prop_files; do
              if [ -f "$file" ]; then
                if grep -qE "ro.miui.ui.version|ro.mi.os.version|ro.vendor.miui.build.region|ro.miui.build.region" "$file" 2>/dev/null; then
                  IS_MIUI=1
                  break
                fi
              fi
            done

            if [ "$IS_MIUI" -eq 0 ]; then
              local r1=$(getprop ro.miui.ui.version.name 2>/dev/null)
              local r2=$(getprop ro.mi.os.version.name 2>/dev/null)
              local r3=$(getprop ro.vendor.miui.build.region 2>/dev/null)
              if [ -n "$r1" ] || [ -n "$r2" ] || [ -n "$r3" ]; then
                IS_MIUI=1
              fi
            fi

            if [ "$IS_MIUI" -eq 1 ]; then
              ui_print "--> Phat hien: MIUI / HyperOS ROM"
              rom="rom_oem"
              dtbo="dtbo_oem"
            else
              ui_print "--> Phat hien: AOSP / Custom ROM"
              rom="rom_aosp"
              dtbo="dtbo_def"
            fi

            dtb="dtb_def"
            batt="batt_def"
            ui_print "--> Da thiet lap xong cho Munch!"
          }

          choose_config_mode() {
            ui_print "--> Chon che do cau hinh :"
            ui_print "  (Vol +) Chon thu cong"
            ui_print "  (Vol -) Tu dong nhan dien"
            ui_print "  ! Mac dinh Tu dong sau 8 giay"

            local timeout=8
            local start now key_event
            start=$(date +%s)

            while :; do
              key_event=$(timeout 0.2 getevent -qlc 1 2>/dev/null)
              if [ -n "$key_event" ]; then
                if echo "$key_event" | grep -q "KEY_VOLUMEUP"; then
                  ui_print "  Da chon : Thu cong" " "
                  configure_manual
                  return 0
                fi
                if echo "$key_event" | grep -q "KEY_VOLUMEDOWN"; then
                  ui_print "  Da chon : Tu dong" " "
                  configure_auto
                  return 0
                fi
              fi
              now=$(date +%s)
              if [ $((now - start)) -ge$timeout ]; then
                ui_print "  ! Het thoi gian cho (Mac dinh: Tu dong)" " "
                configure_auto
                return 0
              fi
            done
          }

          devicename=munch
          devicename2=munchin
          is_slot_device=1
          block=/dev/block/bootdevice/by-name/boot
          ramdisk_compression=auto
          patch_vbmeta_flag=auto

          . tools/ak3-core.sh

          if [ -f /vendor/OemPorts10T.prop ] || [ -f /vendor/etc/init/OemPorts10T.rc ]; then
            abort " ROM OPLUS Port khong duoc ho tro!"
          fi

          if [ "$SIDELOAD" = "1" ]; then
            configure_manual
          else
            choose_config_mode
          fi

          mv *-Image $home/Image 2>/dev/null || true
          mv *-dtb $home/dtb 2>/dev/null || true
          mv *-dtbo.img $home/dtbo.img 2>/dev/null || true

          dump_boot
          ui_print "--> Dang ap dung thiet lap..."
          ui_print " Thong so: $rom,$dtbo,$dtb,$batt"
          patch_cmdline "e404_args" "hdzungx_args=$rom,$dtbo,$dtb,$batt"
          write_boot

          if [ $is_slot_device -eq 1 ]; then
            ui_print "--> Cai dat vao phan vung vendor_boot... "
            block=/dev/block/bootdevice/by-name/vendor_boot
            ramdisk_compression=auto
            patch_vbmeta_flag=auto
            reset_ak
            dump_boot
            write_boot
          fi

          ui_print " " " POCO F4 (Munch) Kernel "
          ui_print " " " --- Hoan tat cai dat --- "
          EOF
          cd ..

      - name: Đóng gói Kernel ZIP (Chuẩn MUNCH-*)
        run: |
          TARGET="MUNCH"

          if [ -f "kernel/out/arch/arm64/boot/Image" ]; then
            cp kernel/out/arch/arm64/boot/Image "AnyKernel3/${TARGET}-Image"
          elif [ -f "kernel/out/arch/arm64/boot/Image.gz" ]; then
            cp kernel/out/arch/arm64/boot/Image.gz "AnyKernel3/${TARGET}-Image"
          else
            echo "LỖI: Không tìm thấy file Image sau khi build!"
            exit 1
          fi

          [ -f "kernel/out/arch/arm64/boot/dtb" ] && cp kernel/out/arch/arm64/boot/dtb "AnyKernel3/${TARGET}-dtb"
          [ -f "kernel/out/arch/arm64/boot/dtbo.img" ] && cp kernel/out/arch/arm64/boot/dtbo.img "AnyKernel3/${TARGET}-dtbo.img"

          KSU_LABEL="${{ inputs.ksu_flavor == 'None' && 'NonKSU' || inputs.ksu_flavor }}"
          SAFE_LABEL=$(echo "$KSU_LABEL" | tr -d ' ()' | tr '/' '-')

          ZIP_NAME="Munch-Perf-${SAFE_LABEL}"
          if [ "${{ inputs.ksu_flavor }}" != "None" ] && [ "${{ inputs.enable_susfs }}" = "true" ]; then
            ZIP_NAME="${ZIP_NAME}-SuSFS"
          fi
          ZIP_NAME="${ZIP_NAME}-$(date +'%Y%m%d-%H%M').zip"

          cd AnyKernel3
          zip -r9 "../${ZIP_NAME}" META-INF tools ${TARGET}-* anykernel.sh -x "*.git*"
          cd ..

          echo "ZIP_PATH=${ZIP_NAME}" >> $GITHUB_ENV
          # Đã bỏ dấu gạch chéo ngược gây lỗi Tag trên GitHub Release
          echo "TAG_NAME=perf-build-$(date +'\%Y\%m\%d-\%H\%M\%S')" >> $GITHUB_ENV

      - name: Lưu trữ Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ZIP_PATH }}
          path: ${{ env.ZIP_PATH }}

      - name: Phát hành GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: "Kernel Munch Perf [${{ inputs.ksu_flavor == 'None' && 'Non-KSU' || inputs.ksu_flavor }}]"
          body: |
            ### 📌 Thông tin bản build Kernel POCO F4 (munch - perf)
            - **Nhánh Kernel:** `perf`
            - **Biến thể Root:** `${{ inputs.ksu_flavor == 'None' && 'Non-KSU (Stock / Clean Base)' || inputs.ksu_flavor }}`
            - **SuSFS Support:** `${{ (inputs.ksu_flavor != 'None' && inputs.enable_susfs) && 'Enabled (Full Flags - Linux 4.19)' || 'Disabled' }}`
            - **SELinux:** Enforcing Hardened (`CONFIG_SECURITY_SELINUX=y`, `CONFIG_ALWAYS_ENFORCE=y`)
            - **AnyKernel3:** Tự động phát hiện môi trường AOSP / HyperOS qua build.prop
            - **Tên tệp:** `${{ env.ZIP_PATH }}`
          files: |
            ${{ env.ZIP_PATH }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
